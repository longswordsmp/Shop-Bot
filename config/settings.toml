# =================================================================================================
# Bot settings (behaviour only — no customer-facing text lives here).
#
# Customer-facing wording lives in config/content.toml. Business decisions (currency, payment method,
# fees, review policy, timers) are intentionally left UNSET: each feature stays disabled and reports
# what is missing (run /status in Discord, or `python -m tools.checklist`) until you decide.
#
# Keys such as "staff" or "ticket_panel" below are INTERNAL identifiers. Customers never see them.
# Visible names are configured in content.toml (server.role.<key>.name, server.channel.<key>.name, ...).
# Full reference: docs/CONFIGURATION.md
# =================================================================================================

schema_version = 1

# Features of the server specification. A feature that is on but still misses text or a business decision
# stays hidden from customers and is listed by /status until it is complete.
[features]
verification = true          # #welcome rules + "I agree" button that grants the Member role
how_to_buy = true            # #how-to-buy step-by-step guide
faq = true                   # #faq question-and-answer panels
shipping = true              # #shipping fulfillment information and regions
announcements = true         # /announce posts to #announcements
catalog = true               # #catalog: one live embed per item
new_arrivals = true          # #new-arrivals opt-in button + automatic updates
reviews = true               # #reviews: verified reviews after completed orders
checkout = true              # #purchase Start button and the private order ticket workflow
tickets = true               # private tickets (used by Report a Problem)
problems = true              # #purchase Report a Problem workflow
my_orders = true             # /myorders for customers
info_panels = false          # generic extra panels (not used by the specification)
credits = false              # store credit (not part of the specification)
dm_notifications = true      # private notifications by direct message (falls back to the ticket/order channel)

[bot]
interaction_cooldown_ms = 700        # technical anti-double-click protection
rate_limit_per_10s = 12              # max component interactions per user per 10 seconds
scheduler_poll_seconds = 5
scheduler_batch_size = 20
scheduler_max_attempts = 5
scheduler_retry_base_seconds = 30
sync_commands_on_startup = true
message_content_intent = true        # privileged intent; required for ticket transcripts
members_intent = false               # privileged intent; not required by any current feature

[permissions]
admin_roles = ["owner"]              # role keys from [[server.roles]] (Discord Administrators are always admins)
staff_roles = ["staff"]
owner_role = "owner"                 # /setup gives this role to OWNER_ID
member_role = "member"               # granted by the #welcome "I agree" button; unlocks members_* channels

[branding]
logo_url = ""                        # https:// image used as author icon / panel thumbnail
banner_url = ""                      # https:// image shown at the bottom of panels when panel_banner = true
footer_icon_url = ""
panel_thumbnail = false
panel_banner = false
show_timestamps = true
progress_filled = ""                 # symbols used by {bar} in common.progress_format (e.g. a filled dot)
progress_empty = ""

[branding.colors]                    # "#RRGGBB" or "" for Discord's default embed color
# Owner's palette: #FF9900 orange, #146EB4 blue, #232F3E navy (also #000000 black and #F2F2F2 light grey,
# which are background/text colors that Discord does not let bots set). The palette has no green or red,
# so success and danger use the green and red Amazon's site uses for "In Stock" and prices.
primary = "#FF9900"                  # panels and main messages
info = "#146EB4"                     # information and confirmations
success = "#007600"                  # completed / paid / approved
warning = "#FF9900"                  # needs attention / pending
danger = "#B12704"                   # errors / rejected / cancelled
neutral = "#232F3E"                  # closed / inactive

# -------------------------------------------------------------------------------------------------
# Server structure created/reconciled by /setup (from the server specification). Set `id` to adopt an
# existing role/channel instead of creating one. Visible names are in content.toml (server.*.name).
# Access levels:
#   public_readonly      everyone (also before accepting the rules) can read; only staff/bot can post
#   public_interactive   everyone can read and post
#   members_readonly     only the Member role (and staff) can see; only staff/bot can post
#   members_interactive  only the Member role (and staff) can see and post
#   staff                hidden from everyone except staff roles and admins (Owner)
#   admin                hidden from everyone except admin roles
#   inherit              (channels only) same permissions as the parent category
# -------------------------------------------------------------------------------------------------

[[server.roles]]
key = "owner"
id = 0
permissions = []
color = ""
hoist = false
mentionable = false

[[server.roles]]
key = "staff"
id = 0
# Manage Messages lets Staff see the staff slash commands (/orders, /order, /ticket, /review, /announce) in Discord's
# command picker: Discord shows them by default only to members with this permission. The bot checks the Staff role
# itself on every use. It also lets staff delete and pin messages in every channel they can see, including the bot's
# panels (/setup posts a deleted panel again). With permissions_mode = "add", /setup only adds missing permissions
# and keeps any others the role already has. Admins can instead fine-tune who sees each command under
# Server Settings -> Integrations -> (the bot) and set this back to [] (an adopted role is then left untouched).
permissions = ["manage_messages"]
permissions_mode = "add"             # "add" keeps the role's other permissions; "exact" sets exactly the list
color = ""
hoist = false
mentionable = true                   # so #staff-chat alerts and reminders can notify staff (operations.ping_roles)

[[server.roles]]
key = "member"
id = 0
permissions = []
color = ""
hoist = false
mentionable = false

[[server.roles]]
key = "customer"
id = 0
permissions = []
color = ""
hoist = false
mentionable = false

[[server.roles]]
key = "restock_alerts"
id = 0
permissions = []
color = ""
hoist = false
mentionable = true                   # so the bot can mention it in #new-arrivals

[[server.categories]]
key = "start_here"
access = "public_readonly"           # visible before accepting the rules

[[server.categories]]
key = "catalog"
access = "members_readonly"

[[server.categories]]
key = "purchase"
access = "members_readonly"          # private ticket/order channels are created here (only owner + staff)

[[server.categories]]
key = "staff"
access = "staff"                     # Staff and Owner only

[[server.channels]]
key = "welcome"
category = "start_here"
access = "inherit"

[[server.channels]]
key = "how_to_buy"
category = "start_here"
access = "inherit"

[[server.channels]]
key = "faq"
category = "start_here"
access = "inherit"

[[server.channels]]
key = "shipping"
category = "start_here"
access = "inherit"

[[server.channels]]
key = "announcements"
category = "start_here"
access = "inherit"

[[server.channels]]
key = "catalog"
category = "catalog"
access = "inherit"

[[server.channels]]
key = "new_arrivals"
category = "catalog"
access = "inherit"

[[server.channels]]
key = "reviews"
category = "catalog"
access = "inherit"

[[server.channels]]
key = "purchase"
category = "purchase"
access = "inherit"

[[server.channels]]
key = "orders"
category = "staff"
access = "inherit"

[[server.channels]]
key = "staff_chat"
category = "staff"
access = "inherit"

[[server.channels]]
key = "bot_log"
category = "staff"
access = "inherit"

[[server.channels]]
key = "transcripts"
category = "staff"
access = "inherit"

# -------------------------------------------------------------------------------------------------
# Specification features. Text for each is in content.toml under the feature's prefix.
# -------------------------------------------------------------------------------------------------

[verification]
channel = "welcome"                  # entry channel for the rules panel; must be public (visible before accepting)
rules = 0                            # REQUIRED: number of server rules on the panel (1-25). Each rule n gets the
                                     # content keys verification.rule.<n>.name / .value (heading and text).
dm_confirmation = false              # also confirm by direct message (only when features.dm_notifications = true)
button_style = "success"             # color of the "I agree" button: primary, secondary, success or danger

[how_to_buy]
channel = "how_to_buy"
steps = 4                            # numbered steps (1-25): finding items, starting a private ticket, completing the
                                     # steps, checking the result. Text: how_to_buy.step.<n>.name / .value
link_channels = ["catalog", "purchase", "faq"]   # channel keys shown as link buttons under the guide (max 25);
                                     # button labels: how_to_buy.link.<channel>.label (+ optional .emoji)

[faq]
channel = "faq"
# One [[faq.sections]] per topic, in display order. `id` is an internal key (never shown); the section title and
# its questions/answers are content keys faq.section.<id>.title and faq.section.<id>.q.<n>.question / .answer.
# `questions` = number of questions in the section (1-25). Long sections continue in further embeds/messages.
[[faq.sections]]
id = "general"
questions = 1

[[faq.sections]]
id = "transactions"
questions = 1

[[faq.sections]]
id = "order_status"
questions = 1

[[faq.sections]]
id = "cancellations"
questions = 1

[[faq.sections]]
id = "problems"
questions = 1

[shipping]
channel = "shipping"
statuses = ["full", "partial", "none"]   # enabled availability categories, in display order:
                                     # full = fully supported, partial = partially supported, none = unsupported.
                                     # Labels/indicators: shipping.status.<status>.label / .indicator / .description
info_sections = 0                    # extra information fields (0-25), e.g. delivery or fulfillment options.
                                     # Text: shipping.info.<n>.name / .value
info_position = "after"              # "before" or "after" the region list
# Regions are business information: add one [[shipping.regions]] per region (none are shipped). `id` is an internal
# key; the visible name is shipping.region.<id>.name (optional note: shipping.region.<id>.note). `status` must be
# listed in `statuses` above. Example:
# [[shipping.regions]]
# id = "region_a"
# status = "full"

[announcements]
channel = "announcements"            # channel key /announce posts to
roles = []                           # extra role keys allowed to use /announce (staff_roles and admins always can)
mention_roles = []                   # role keys staff may choose to ping with an announcement ([] = never ping);
                                     # a role must be mentionable (server.roles mentionable = true) to be pinged
allow_image = true                   # staff may attach one image (png, jpg, gif, webp) to an announcement
# Optional extra inputs of the /announce form (at most 3), each posted as an embed field. The field's heading is
# the content key announcements.field.<id>.name; staff type the value. Example:
# [[announcements.fields]]
# id = "details"
# style = "short"                    # "short" (one line) or "paragraph"
# required = false                   # true = staff must fill it in
# max_length = 1024                  # 1-1024 characters

[new_arrivals]
channel = "new_arrivals"             # channel of the opt-in panel and the automatic product updates
role = "restock_alerts"              # role key the panel button turns on/off (must grant no permissions)
announce_new_products = true         # post an update when a product is added or switched back on
announce_restocks = true             # post an update when a sold-out product can be ordered again
mention_role = true                  # mention the role in those updates (the role must be mentionable)

# Report a Problem (#purchase button): a private step to pick the order and issue type, the issue form, then a
# private ticket per report where staff Resolve or Reject it. Every word customers see is in content.toml under
# problems.* (issue-type labels: problems.type.<id>.*). Tickets use the [tickets] settings (numbering, transcripts,
# closing, staff alert channel).
[problems]
discord_category = "purchase"        # category key where report tickets are created (customer + staff only)
eligible_statuses = ["paid", "processing", "fulfilled"]   # order statuses a report may refer to ([] = never an order)
allow_without_order = true           # also offer "not about an order" (and allow reports without any order)
max_open_per_user = 1                # undecided reports with an open ticket per customer
staff_roles = []                     # extra role keys that may resolve/reject (permissions.staff_roles always can)
require_reason_on_reject = true      # rejecting asks staff for a reason shown to the customer
ping_staff = false                   # mention the staff roles in the new-report alert (or in the ticket without one)

# Issue types (max 25). The id is internal; label/description/emoji are content keys problems.type.<id>.*
# Optional form per type (max 5 fields, same schema as ticket forms; labels: problems.type.<id>.form.<field>.*).
[[problems.types]]
id = "general"

[[problems.types.form]]
id = "details"
style = "paragraph"
required = true
min_length = 0
max_length = 1000

[my_orders]
orders_per_page = 5                  # orders per /myorders page (1-9; fewer when the cards would not fit one message)

[operations]
# Staff side of orders and tickets: #staff-chat alerts, reminders, Owner alerts, failure reports.
# (Switched on automatically while checkout or tickets is on; the wording is in content.toml under operations.*)
staff_channel = "staff_chat"         # staff alert channel: new/paid order alerts, reminders, failure alerts (required)
ping_roles = ["staff"]               # role keys mentioned on alerts that need attention (the role must be mentionable,
                                     # or the bot needs "Mention @everyone, @here and All Roles", to notify anyone)
owner_dm_alerts = true               # also send order alerts and critical failure alerts to the Owner (OWNER_ID) by
                                     # direct message; when the DM fails they are posted in staff_channel instead
answers_in_orders_channel = false    # false = the customer's typed form answers (details, fulfillment option and
                                     # submission forms) are NOT posted in #orders; staff see them privately with the
                                     # order record's Details button or /order view (staff-checked, only to the
                                     # person who asked). true = also post them as messages under each order record
                                     # in #orders, visible to everyone who can read that channel.
# Reminders posted in staff_channel (minutes; 0 = off). Business decisions: left off until you choose them.
unclaimed_order_minutes = 0          # an open order nobody claimed for this long
unpaid_order_minutes = 0             # an order still waiting for payment this long after it was submitted
unfulfilled_order_minutes = 0        # a paid order not completed this long after the payment was confirmed
unanswered_ticket_minutes = 0        # a support ticket whose customer has waited this long for a staff reply
reminder_repeat_minutes = 0          # repeat a reminder this often while it still applies (0 = remind once)

[tickets]
panel_channel = ""                   # "" = no standalone ticket panel (support starts from #purchase)
panel_style = "buttons"              # "buttons" (one button per category) or "select" (dropdown)
staff_roles = []                     # extra role keys with access to every ticket (permissions.staff_roles always have access)
transcript_channel = "transcripts"   # "" disables transcripts
transcript_dm_user = false
staff_alert_channel = "staff_chat"   # "" disables staff alerts for new tickets
max_open_per_user = 1
creation_cooldown_seconds = 30
max_created_per_user_per_day = 10    # anti-abuse cap on new tickets per user per 24 h (0 = unlimited)
allow_user_close = true
allow_reopen = true
user_can_reopen = false
close_confirmation = true
lock_on_close = true                 # the ticket owner can no longer post after closing
closed_category = ""                 # category key to move closed tickets into ("" = leave in place)
delete_after_close_minutes = 0       # 0 = never delete automatically
auto_close_inactive_minutes = 0      # 0 = never close automatically
auto_close_warning_minutes = 0       # 0 = no warning before auto-close (must be less than the above)
channel_name_pattern = "{prefix}-{number}-{user}"   # placeholders: {prefix} (content), {number}, {user}
number_padding = 4

# Categories of the standalone ticket panel (only used when tickets.panel_channel is set). Support starts from
# #purchase (Report a Problem), so none is defined. Example:
# [[tickets.categories]]
# id = "general"                     # internal id; button label etc. in content.toml tickets.category.general.*
# discord_category = "purchase"
# staff_roles = []
# max_open_per_user = 0              # 0 = use tickets.max_open_per_user
# button_style = "primary"
# ping_staff = false
# Optional form shown before the ticket is created (max 5 fields). Labels are content keys
# tickets.category.general.form.<id>.label / .placeholder / .description
# [[tickets.categories.form]]
# id = "details"
# style = "paragraph"
# required = true
# min_length = 0
# max_length = 1000

[catalog]
listing_channel = "catalog"          # "" disables the live product listing
products_per_listing_message = 1     # 1-10 product embeds per listing message (1 = one message per item)
manager_roles = []                   # extra role keys allowed to manage products (admins always can)
browse_enabled = false               # private, paginated product browsing from the shop panel
image_hosts = []                     # allowed hosts for image LINKS (/product image url:); [] = any https host.
                                     # Uploaded files (/product image file:) are stored by the bot instead.
low_stock_threshold = 0              # 1..N units left shows catalog.availability.low_stock in the warning
                                     # color; 0 = no low-stock state (business decision, off by default)
# Each product card's color shows its availability: success = available, warning = low stock,
# danger = out of stock (its buy button is then disabled). Buy buttons appear while checkout is on.

[checkout]
panel_channel = "purchase"
order_category = "purchase"
staff_roles = []
staff_channel = "orders"             # staff order controls are posted here (required)
currency = ""                        # REQUIRED business decision: ISO 4217 code such as "USD"
currency_exponent = -1               # -1 = standard minor units for the currency
decimal_separator = "."
thousands_separator = ","
max_open_orders_per_user = 1
max_line_quantity = 0                # 0 = only limited by stock and per-product limits
max_cart_lines = 20
min_order_total_minor = 0
products_per_page = 25
session_expiry_minutes = 0           # 0 = an unsubmitted cart never expires automatically
payment_expiry_minutes = 0           # 0 = an unpaid order never expires automatically
payment_reminder_minutes = 0         # 0 = no payment reminder
session_expiry_warning_minutes = 0   # warn in the ticket this many minutes before an unsubmitted cart expires
                                     # (0 = no warning; needs session_expiry_minutes and must be less than it)
delete_channel_after_close_minutes = 0
transcript_on_close = true
customer_role = "customer"           # role key given to members whose order reached customer_role_on ("" = off)
customer_role_on = "fulfilled"       # "paid" (payment confirmed) or "fulfilled" (order completed)
customer_role_remove_on_refund = true  # remove the role when an order is fully refunded and no other order qualifies
# Optional submission form (max 5 fields), asked when the customer presses Submit (e.g. a reference the business
# needs). The answers are stored with the order and shown to staff. Labels are content keys
# checkout.submission.form.<id>.label / .description / .placeholder; the form title is checkout.submission.modal_title.
# [[checkout.submission_form]]
# id = "reference"
# style = "short"                    # "short" or "paragraph"
# required = true
# min_length = 0
# max_length = 100
# Fulfillment options (delivery, pickup, ...) are business decisions. Labels live in content.toml
# checkout.fulfillment.<id>.label / .description. Example:
# [[checkout.fulfillment_options]]
# id = "option_a"
# fee_minor = 0
# Optional fees. kind = "flat" (amount_minor) or "percent" (basis_points, 100 = 1%):
# [[checkout.fees]]
# id = "service"
# kind = "flat"
# amount_minor = 0

[payments]
provider = ""                        # REQUIRED business decision. Implemented: "manual" (staff confirm payment)

[credits]
allow_at_checkout = true

[reviews]
channel = "reviews"
prompt_delay_minutes = -1            # REQUIRED when reviews are enabled: minutes after fulfillment (0 = immediately)
rating_scale = 0                     # REQUIRED when reviews are enabled: 1-10
allow_comment = true
comment_required = false
comment_max_length = 1000
prompt_via = "dm_then_channel"       # "dm", "channel" (the order channel), or "dm_then_channel"

[notifications]
fallback_to_channel = true

[audit]
channel = "bot_log"                  # staff-only channel for audit entries ("" = database only)
retention_days = 0                   # 0 = keep audit events forever
