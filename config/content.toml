# --- Verification: private replies after the 'I agree' button ---

# Private reply to a member who clicks the 'I agree' button although they already have the Member role (nothing changes). {user_name} is the member's display name, {user_mention} mentions them (mentions do not ping in embeds). You may write {channel_<key>} (for example {channel_catalog}) for a clickable link to a channel from server.channels.
# description · max 4096 characters · required · placeholders: {user_name}, {user_mention}, {channel_welcome}, {channel_how_to_buy}, {channel_faq}, {channel_shipping}, {channel_announcements}, {channel_catalog}, {channel_new_arrivals}, {channel_reviews}, {channel_purchase}, {channel_orders}, {channel_staff_chat}, {channel_bot_log}, {channel_transcripts}
verification.already_verified.description = "Hi {user_name}, you already have the **Member** role, so there's nothing more to do. Browse {channel_catalog} or start an order in {channel_purchase}."

# Optional title of the private reply to a member who clicks the 'I agree' button although they already have the Member role. {user_name} is the member's display name.
# title · max 256 characters · optional · placeholders: {user_name}
verification.already_verified.title = "You're already a member"

# Private confirmation (only the member sees it) after they accepted the rules and received the Member role; the member-only channels are visible from now on. {user_name} is the member's display name, {user_mention} mentions them (mentions do not ping in embeds). You may write {channel_<key>} (for example {channel_catalog}) for a clickable link to a channel from server.channels.
# description · max 4096 characters · required · placeholders: {user_name}, {user_mention}, {channel_welcome}, {channel_how_to_buy}, {channel_faq}, {channel_shipping}, {channel_announcements}, {channel_catalog}, {channel_new_arrivals}, {channel_reviews}, {channel_purchase}, {channel_orders}, {channel_staff_chat}, {channel_bot_log}, {channel_transcripts}
verification.confirmed.description = '''
Thanks for accepting the rules. You now have the **Member** role and these channels are open to you:
• {channel_catalog}: browse our products
• {channel_new_arrivals}: new products and restocks
• {channel_reviews}: reviews from our customers
• {channel_purchase}: start an order or report a problem

First order? {channel_how_to_buy} walks you through it.'''

# Optional title of the private confirmation shown after the member accepted the rules and received the Member role. {user_name} is the member's display name.
# title · max 256 characters · optional · placeholders: {user_name}
