# Content: every text customers can see. Keys are internal identifiers; customers never see them.
#
# Values are used exactly as written (never trimmed or rewritten). An empty value ("") means
# "not configured": the related message or panel is not shown until its required keys are set.
# {placeholders} listed for a key are replaced with data; any other text, including braces, is kept.
# Multi-line values use '''...''' blocks: the line break right after the opening ''' is not part
# of the value. Values entered with /content set in Discord take precedence over this file.

# ==================================================================================================
# Feature: core
# ==================================================================================================

# --- Branding text ---

# Optional author line at the top of every customer-facing embed (uses the logo as icon).
# author · max 256 characters · optional
branding.author_name = ""

# Optional footer on every customer-facing embed.
# footer · max 2048 characters · optional
branding.footer_text = "AmazonYaarts"

# --- Shared buttons ---

# Back button in multi-step workflows.
# button_label · max 80 characters · optional
common.button.back = "{icon_arrow_left} Back"

# Cancel button on prompts and workflows.
# button_label · max 80 characters · optional
common.button.cancel = "{icon_cross} Cancel"

# Continue button in multi-step workflows.
# button_label · max 80 characters · optional
common.button.continue = "{icon_arrow_right} Continue"

# Next-page button in paginated lists.
# button_label · max 80 characters · optional
common.button.next_page = "Next page"

# Previous-page button in paginated lists.
# button_label · max 80 characters · optional
common.button.previous_page = "Previous page"

# --- Error messages (shown privately to the person who clicked) ---

# Shown when someone clicks again while their previous click is still being processed. Optional: if empty, the duplicate click is silently ignored.
# description · max 4096 characters · optional
common.error.busy = "We're still working on your previous click. Please wait a moment."

# Shown when someone acts too quickly in a row.
# description · max 4096 characters · required · placeholders: {retry_after}
common.error.cooldown = "You're doing that a little too quickly. Please try again in {retry_after}s."

# Shown when an action fails unexpectedly. Internal details are never shown. You may include {error_id}: a short reference that also appears in the bot's logs (empty when there is none).
# description · max 4096 characters · required · placeholders: {error_id}
common.error.generic = '''
Something went wrong on our side. Please try again in a moment.
If it keeps happening, contact our team and mention reference **{error_id}**.'''

# Shown when a form entry is invalid (e.g. a quantity that is not a whole number).
# description · max 4096 characters · required
common.error.invalid_input = "Something you entered isn't valid. Please check it and try again (for example, a quantity must be a whole number)."

# Shown when the ticket/order/item behind a control no longer exists.
# description · max 4096 characters · required
common.error.not_found = "We couldn't find what this refers to. It may have been closed, removed or replaced by a newer message."

# Shown when someone uses a control they are not allowed to use (e.g. a staff-only button).
# description · max 4096 characters · required
common.error.permission_denied = "You can't use this. It is reserved for staff or for the member it belongs to."

# Optional title above every error message.
# title · max 256 characters · optional
common.error.title = "Couldn't complete that"

# Shown when a feature is switched off or not fully configured.
# description · max 4096 characters · required
common.error.unavailable = "This isn't available right now. Please try again later."

# --- Formats ---

# How prices are written, e.g. '{amount} {currency}'. {amount} is formatted with the separators from settings.checkout. Required by catalog and checkout.
# format · max 100 characters · optional · placeholders: {amount}, {currency}
common.money_format = "${amount}"

# Optional page indicator added to the footer of paginated lists.
# format · max 100 characters · optional · placeholders: {page}, {pages}
common.page_indicator = "Page {page} of {pages}"

# Optional step indicator shown in multi-step workflows. {bar} uses the progress symbols from settings.branding.
# format · max 100 characters · optional · placeholders: {current}, {total}, {bar}
common.progress_format = "{bar} Step {current} of {total}"

