operations.reminder.unpaid.title = "Order #{order_number} is still unpaid"

# --- Operations: failure alerts (staff channel) ---

# Staff alert when a button, form or command failed unexpectedly (the member got the configured error message; details are in the bot logs). {source} is the internal name of the control or command, {error_id} the reference the member saw, {error} the error type.
# description · max 4096 characters · required · placeholders: {source}, {error_id}, {error}
operations.failure.error.description = '''
A member got an error message while using the bot.
• Where: `{source}`
• Reference: `{error_id}`
• Error type: `{error}`
The full details are in the bot logs under this reference.'''

# Optional title of the Staff alert when a button, form or command failed unexpectedly (the member got the configured error message; details are in the bot logs). {source} is the internal name of the control or command, {error_id} the reference the member saw, {error} the error type.
# title · max 256 characters · optional · placeholders: {source}, {error_id}, {error}
operations.failure.error.title = "Unexpected error"

# Staff alert when a notification could not be delivered: a private notification to a member, neither by direct message nor in the fallback channel, or a message the bot posts in a channel (e.g. a ticket's staff alert or an order's details). {user_mention} mentions the member it was for (no ping; '-' when it was for staff), {notification} is the notification's internal name (e.g. checkout.paid).
# description · max 4096 characters · required · placeholders: {user_mention}, {notification}
operations.failure.notification.description = '''
The bot could not deliver the message `{notification}`.
• Meant for: {user_mention}
If it was meant for a member, it reached them neither by direct message nor in their ticket; otherwise the bot could not post in its channel. Check the bot's permissions there and follow up by hand if needed.'''

# Optional title of the Staff alert when a notification could not be delivered: a private notification to a member, neither by direct message nor in the fallback channel, or a message the bot posts in a channel (e.g. a ticket's staff alert or an order's details). {user_mention} mentions the member it was for (no ping; '-' when it was for staff), {notification} is the notification's internal name (e.g. checkout.paid).
# title · max 256 characters · optional · placeholders: {user_mention}, {notification}
operations.failure.notification.title = "Notification not delivered"

# Staff alert when the customer role could not be given or removed (missing role, role above the bot's highest role, or missing permission). {user_mention} mentions the member (no ping), {role_mention} the role.
# description · max 4096 characters · required · placeholders: {user_mention}, {role_mention}
operations.failure.role.description = '''
The bot could not update the Customer role ({role_mention}) for {user_mention}.
Check that the role exists, sits below the bot's highest role and that the bot has the Manage Roles permission. Then update the member's roles by hand.'''

# Optional title of the Staff alert when the customer role could not be given or removed (missing role, role above the bot's highest role, or missing permission). {user_mention} mentions the member (no ping), {role_mention} the role.
# title · max 256 characters · optional · placeholders: {user_mention}, {role_mention}
operations.failure.role.title = "Customer role not updated"

# Staff alert when a scheduled task failed permanently after its retries (details are in the audit log). {task} is the task's internal name, {task_id} its number, {attempts} the attempts made.
# description · max 4096 characters · required · placeholders: {task}, {task_id}, {attempts}
operations.failure.task.description = "The task `{task}` (no. {task_id}) failed after {attempts} attempts and will not be retried. The details are in the audit log. If it was about an order or a ticket, check it and finish that step by hand (for example, message the customer)."

# Optional title of the Staff alert when a scheduled task failed permanently after its retries (details are in the audit log). {task} is the task's internal name, {task_id} its number, {attempts} the attempts made.
# title · max 256 characters · optional · placeholders: {task}, {task_id}, {attempts}
operations.failure.task.title = "Scheduled task failed"

