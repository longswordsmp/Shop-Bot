# description · max 4096 characters · optional · placeholders: {number}
tickets.auto_closed.description = '''
This ticket was closed automatically because there were no new messages for a while. You can still read it, but only our team can post here now.

{icon_lock} The buttons below are for our team only, for example to reopen the ticket if you need more help.'''

