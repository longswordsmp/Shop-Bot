# Optional text of the private message telling the customer their review was not approved (it is not published). Sent by direct message when features.dm_notifications is on, otherwise (or when direct messages are closed) in the order channel with a mention (notifications.fallback_to_channel). If empty, no message is sent. {order_number} is the number of the reviewed order.
# description · max 4096 characters · optional · placeholders: {order_number}
reviews.notice.rejected.description = "Thank you for your feedback on order #{order_number}. Our team decided not to publish this review. If something is wrong with your order, press **Report a Problem** in the purchase channel and our team will help."

