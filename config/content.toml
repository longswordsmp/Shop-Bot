# --- Operations: staff reminders (staff channel) ---

# Optional link button under unanswered-ticket reminders that jumps to the ticket.
# button_label · max 80 characters · optional
operations.button.open_ticket = "Open ticket"

# Staff reminder about a support ticket whose customer waits for a staff reply, posted once it waited operations.unanswered_ticket_minutes minutes (again every operations.reminder_repeat_minutes while it still waits, when set). {ticket_number} is the ticket number, {customer_mention} mentions the customer (no ping), {ticket_channel} links the ticket; {waiting_since} is when it started waiting (shown in each reader's time zone), {minutes} the threshold in minutes. Needed when operations.unanswered_ticket_minutes is above 0.
# description · max 4096 characters · required · placeholders: {ticket_number}, {customer_mention}, {ticket_channel}, {waiting_since}, {minutes}
operations.reminder.unanswered.description = '''
{customer_mention} is waiting for a staff reply in ticket **#{ticket_number}**. They started waiting {waiting_since}.
• Ticket: {ticket_channel}
Please reply in the ticket.'''

# Optional title of the Staff reminder about a support ticket whose customer waits for a staff reply, posted once it waited operations.unanswered_ticket_minutes minutes (again every operations.reminder_repeat_minutes while it still waits, when set). {ticket_number} is the ticket number, {customer_mention} mentions the customer (no ping), {ticket_channel} links the ticket; {waiting_since} is when it started waiting (shown in each reader's time zone), {minutes} the threshold in minutes.
# title · max 256 characters · optional · placeholders: {ticket_number}, {customer_mention}, {ticket_channel}, {waiting_since}, {minutes}
operations.reminder.unanswered.title = "Ticket #{ticket_number} needs a reply"

# Staff reminder about an open order nobody claimed, posted once it waited operations.unclaimed_order_minutes minutes (again every operations.reminder_repeat_minutes while it still waits, when set). {order_number} is the order number, {customer_mention} mentions the customer (no ping), {total} is the order total, {status} the status name (checkout.status_label.*), {order_channel} links the customer's order channel; {waiting_since} is when it started waiting (shown in each reader's time zone), {minutes} the threshold in minutes. Needed when operations.unclaimed_order_minutes is above 0.
# description · max 4096 characters · required · placeholders: {order_number}, {customer_mention}, {total}, {status}, {order_channel}, {waiting_since}, {minutes}
operations.reminder.unclaimed.description = '''
Order **#{order_number}** from {customer_mention} ({total}) has not been claimed. It started waiting for a claim {waiting_since}.
• Status: {status}
• Order ticket: {order_channel}
Please claim it on the order record.'''

# Optional title of the Staff reminder about an open order nobody claimed, posted once it waited operations.unclaimed_order_minutes minutes (again every operations.reminder_repeat_minutes while it still waits, when set). {order_number} is the order number, {customer_mention} mentions the customer (no ping), {total} is the order total, {status} the status name (checkout.status_label.*), {order_channel} links the customer's order channel; {waiting_since} is when it started waiting (shown in each reader's time zone), {minutes} the threshold in minutes.
# title · max 256 characters · optional · placeholders: {order_number}, {customer_mention}, {total}, {status}, {order_channel}, {waiting_since}, {minutes}
operations.reminder.unclaimed.title = "Order #{order_number} is not claimed"

# Staff reminder about a paid order not completed yet, posted once it waited operations.unfulfilled_order_minutes minutes (again every operations.reminder_repeat_minutes while it still waits, when set). {order_number} is the order number, {customer_mention} mentions the customer (no ping), {total} is the order total, {status} the status name (checkout.status_label.*), {order_channel} links the customer's order channel; {waiting_since} is when it started waiting (shown in each reader's time zone), {minutes} the threshold in minutes. Needed when operations.unfulfilled_order_minutes is above 0.
# description · max 4096 characters · required · placeholders: {order_number}, {customer_mention}, {total}, {status}, {order_channel}, {waiting_since}, {minutes}
operations.reminder.unfulfilled.description = '''
Order **#{order_number}** from {customer_mention} ({total}) was paid {waiting_since} and is not completed yet.
• Status: {status}
• Order ticket: {order_channel}
Mark it completed once it has shipped, or add a note on the order record if it is delayed.'''

# Optional title of the Staff reminder about a paid order not completed yet, posted once it waited operations.unfulfilled_order_minutes minutes (again every operations.reminder_repeat_minutes while it still waits, when set). {order_number} is the order number, {customer_mention} mentions the customer (no ping), {total} is the order total, {status} the status name (checkout.status_label.*), {order_channel} links the customer's order channel; {waiting_since} is when it started waiting (shown in each reader's time zone), {minutes} the threshold in minutes.
# title · max 256 characters · optional · placeholders: {order_number}, {customer_mention}, {total}, {status}, {order_channel}, {waiting_since}, {minutes}
operations.reminder.unfulfilled.title = "Paid order #{order_number} is not completed"

# Staff reminder about an order still waiting for payment, posted once it waited operations.unpaid_order_minutes minutes (again every operations.reminder_repeat_minutes while it still waits, when set). {order_number} is the order number, {customer_mention} mentions the customer (no ping), {total} is the order total, {status} the status name (checkout.status_label.*), {order_channel} links the customer's order channel; {waiting_since} is when it started waiting (shown in each reader's time zone), {minutes} the threshold in minutes. Needed when operations.unpaid_order_minutes is above 0.
# description · max 4096 characters · required · placeholders: {order_number}, {customer_mention}, {total}, {status}, {order_channel}, {waiting_since}, {minutes}
operations.reminder.unpaid.description = '''
Order **#{order_number}** from {customer_mention} ({total}) is still waiting for payment. It was submitted {waiting_since}.
• Order ticket: {order_channel}
Make sure the payment instructions are posted in the order ticket and check in with the customer there. If the order will not be paid, reject or cancel it.'''

# Optional title of the Staff reminder about an order still waiting for payment, posted once it waited operations.unpaid_order_minutes minutes (again every operations.reminder_repeat_minutes while it still waits, when set). {order_number} is the order number, {customer_mention} mentions the customer (no ping), {total} is the order total, {status} the status name (checkout.status_label.*), {order_channel} links the customer's order channel; {waiting_since} is when it started waiting (shown in each reader's time zone), {minutes} the threshold in minutes.
