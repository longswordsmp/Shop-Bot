# --- Reviews: decision notices (private, to the customer, when reviews.require_approval is on) ---

# Optional text of the private message telling the customer their review was approved; it is sent once the review is published in the reviews channel. Sent by direct message when features.dm_notifications is on, otherwise (or when direct messages are closed) in the order channel with a mention (notifications.fallback_to_channel). If empty, no message is sent. {order_number} is the number of the reviewed order. {review_link} is a link to the published review.
# description · max 4096 characters · optional · placeholders: {order_number}, {review_link}
reviews.notice.approved.description = '''
Thank you. Our team approved your review, and it is now published in our reviews channel.

[View your review]({review_link})'''

# Optional title of the private message telling the customer their review was approved and published. Needs reviews.notice.approved.description. {order_number} is the number of the reviewed order.
# title · max 256 characters · optional · placeholders: {order_number}
