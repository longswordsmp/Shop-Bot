verification.welcome.description = '''
We sell right here on Discord: browse our products, order in your own private order ticket and follow each order from payment to dispatch.

To enter the shop, read the rules below and press **I agree, enter the server**. You get the **Member** role, which unlocks the catalog, new arrivals, reviews and purchase channels.

New here? {channel_how_to_buy} explains how ordering works, {channel_shipping} shows where we ship and {channel_faq} answers common questions.'''

