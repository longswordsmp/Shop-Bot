# --- Operations: staff alerts (staff channel) ---

# Staff alert when a customer submitted a new order (operations.ping_roles are mentioned). {order_number} is the order number, {customer_mention} mentions the customer (no ping), {total} is the order total, {status} the status name (checkout.status_label.*), {order_channel} links the customer's order channel.
# description · max 4096 characters · required · placeholders: {order_number}, {customer_mention}, {total}, {status}, {order_channel}
operations.alert.new_order.description = '''
{customer_mention} placed order **#{order_number}** for **{total}**.
• Status: {status}
• Order ticket: {order_channel}
Claim it on the order record, then post the payment instructions, including any shipping costs, in the order ticket.'''

# Optional title of the Staff alert when a customer submitted a new order (operations.ping_roles are mentioned). {order_number} is the order number, {customer_mention} mentions the customer (no ping), {total} is the order total, {status} the status name (checkout.status_label.*), {order_channel} links the customer's order channel.
# title · max 256 characters · optional · placeholders: {order_number}, {customer_mention}, {total}, {status}, {order_channel}
operations.alert.new_order.title = "New order #{order_number}"

# Staff alert when an order's payment was confirmed and it waits to be completed (operations.ping_roles are mentioned). {order_number} is the order number, {customer_mention} mentions the customer (no ping), {total} is the order total, {status} the status name (checkout.status_label.*), {order_channel} links the customer's order channel.
# description · max 4096 characters · required · placeholders: {order_number}, {customer_mention}, {total}, {status}, {order_channel}
operations.alert.paid_order.description = '''
The payment for order **#{order_number}** ({total}) from {customer_mention} is confirmed.
• Status: {status}
• Order ticket: {order_channel}
Prepare the order, add tracking details if you have them, and mark it completed once it has shipped.'''

# Optional title of the Staff alert when an order's payment was confirmed and it waits to be completed (operations.ping_roles are mentioned). {order_number} is the order number, {customer_mention} mentions the customer (no ping), {total} is the order total, {status} the status name (checkout.status_label.*), {order_channel} links the customer's order channel.
# title · max 256 characters · optional · placeholders: {order_number}, {customer_mention}, {total}, {status}, {order_channel}
operations.alert.paid_order.title = "Payment confirmed for order #{order_number}"

# Optional link button under order alerts and order reminders that jumps to the order's live record in checkout.staff_channel.
