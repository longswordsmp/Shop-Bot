# ==================================================================================================
# Feature: tickets
# ==================================================================================================

# --- Ticket status messages (posted in the ticket channel) ---

# Posted in an inactive ticket (and pings the customer) tickets.auto_close_warning_minutes before it closes automatically. {minutes} is that number of minutes, {user_mention} mentions the customer. Needed when both auto-close settings are above 0.
# description · max 4096 characters · optional · placeholders: {minutes}, {user_mention}
tickets.auto_close_warning.description = "{user_mention}, this ticket has had no new messages for a while and will close automatically in **{minutes} minutes**. Send a message here to keep it open."

# Text of the ticket-closed message when the ticket was closed automatically for inactivity (used instead of tickets.closed.description). {number} is the ticket number, zero-padded to tickets.number_padding digits. Needed when tickets.auto_close_inactive_minutes is above 0.
# description · max 4096 characters · optional · placeholders: {number}
tickets.auto_closed.description = "This ticket was closed automatically because there were no new messages for a while. You can still read it, but only our team can post here now and use the buttons below, for example to reopen it if more help is needed."

# Posted in the ticket when a staff member claims it. {staff_mention} mentions that staff member.
# description · max 4096 characters · required · placeholders: {staff_mention}
tickets.claimed.description = "{staff_mention} from our team is now handling this ticket and will help you here."

# Text of the ticket-closed message when someone closed it. {closer_mention} mentions who closed it. {number} is the ticket number, zero-padded to tickets.number_padding digits.
# description · max 4096 characters · required · placeholders: {closer_mention}, {number}
tickets.closed.description = "{closer_mention} closed this ticket. You can still read it, but only our team can post here now and use the buttons below, for example to reopen it if more help is needed."

