# --- Ticket status messages (posted in the ticket channel) ---

# Posted in an inactive ticket (and pings the customer) tickets.auto_close_warning_minutes before it closes automatically. {minutes} is that number of minutes, {user_mention} mentions the customer. Needed when both auto-close settings are above 0.
# description · max 4096 characters · optional · placeholders: {minutes}, {user_mention}
tickets.auto_close_warning.description = ""

# Text of the ticket-closed message when the ticket was closed automatically for inactivity (used instead of tickets.closed.description). {number} is the ticket number, zero-padded to tickets.number_padding digits. Needed when tickets.auto_close_inactive_minutes is above 0.
# description · max 4096 characters · optional · placeholders: {number}
tickets.auto_closed.description = ""

# Posted in the ticket when a staff member claims it. {staff_mention} mentions that staff member.
# description · max 4096 characters · required · placeholders: {staff_mention}
tickets.claimed.description = ""

# Text of the ticket-closed message when someone closed it. {closer_mention} mentions who closed it. {number} is the ticket number, zero-padded to tickets.number_padding digits.
# description · max 4096 characters · required · placeholders: {closer_mention}, {number}
tickets.closed.description = ""

# Optional field name under which the close reason given by staff (/ticket close reason) is shown on the ticket-closed message. If empty, the reason is not shown to the customer.
# field_name · max 256 characters · optional
tickets.closed.reason_label = ""

# Title of the message posted in the ticket when it is closed (manually or automatically); this message carries the reopen/transcript/delete buttons. {number} is the ticket number, zero-padded to tickets.number_padding digits.
# title · max 256 characters · required · placeholders: {number}
tickets.closed.title = ""

# Posted in the ticket after closing when the channel will be deleted automatically. {minutes} is tickets.delete_after_close_minutes. Needed when that setting is above 0.
# description · max 4096 characters · optional · placeholders: {minutes}
tickets.deletion_scheduled.description = ""

# Posted in the ticket when it is reopened. {actor_mention} mentions who reopened it. Needed when tickets.allow_reopen = true.
# description · max 4096 characters · required · placeholders: {actor_mention}
tickets.reopened.description = ""

# Posted in the ticket when it is unclaimed.
# description · max 4096 characters · required
tickets.unclaimed.description = ""

# Posted in the ticket when staff add someone to it (/ticket add). {user_mention} mentions (and pings) the added member.
# description · max 4096 characters · required · placeholders: {user_mention}
tickets.user_added.description = ""

# Posted in the ticket when staff remove someone from it (/ticket remove). {user_mention} mentions the removed member.
# description · max 4096 characters · required · placeholders: {user_mention}
tickets.user_removed.description = ""

